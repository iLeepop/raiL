[package]
name = "session"
version = "0.1.0"
edition = "2024"

[dependencies]
llm = { path = "../llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["fs", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
