[package]
name = "rai_l"
version = "0.1.0"
edition = "2024"

[dependencies]
llm = { path = "./llm" }
agent = {path = "./agent"}
session = { path = "./session" }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
dotenvy = "0.15"
serde_json = "1"
[workspace]
resolver = "3"
members = [
    "llm",
    "agent",
    "session",
]
